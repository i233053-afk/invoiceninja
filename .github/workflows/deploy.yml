name: Production Deploy

on:
  push:
    branches:
      - v5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          # Create SSH directory
          mkdir -p $HOME/.ssh
          
          # Add private key safely
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
          
          # Add server to known hosts
          ssh-keyscan -H $(echo "${{ secrets.PROD_SERVER }}" | cut -d@ -f2) >> $HOME/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . "${{ secrets.PROD_SERVER }}:/home/amna/invoice-ninja"
