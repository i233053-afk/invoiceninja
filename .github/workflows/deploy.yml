name: Production Deploy

on:
  push:
    branches:
      - v5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Safe extraction of server host
          SERVER_HOST="${{ secrets.PROD_SERVER#*@ }}"
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . "${{ secrets.PROD_SERVER }}:/home/amna/invoice-ninja"
