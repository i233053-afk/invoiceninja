name: Production Deploy

on:
  push:
    branches:
      - v5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p $HOME/.ssh
          cat <<EOF > $HOME/.ssh/id_rsa
${{ secrets.SSH_PRIVATE_KEY }}
EOF
          chmod 600 $HOME/.ssh/id_rsa
          ssh-keyscan -H $(echo "${{ secrets.PROD_SERVER }}" | cut -d@ -f2) >> $HOME/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . "${{ secrets.PROD_SERVER }}:/home/amna/invoice-ninja"
