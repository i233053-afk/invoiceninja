name: Production Deploy

on:
  push:
    branches:
      - v5-stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known_hosts
          SERVER_IP=$(echo "${{ secrets.PROD_SERVER }}" | cut -d@ -f2)
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          
      - name: Deploy to Server
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . "${{ secrets.PROD_SERVER }}:/home/amna/invoice-ninja"
