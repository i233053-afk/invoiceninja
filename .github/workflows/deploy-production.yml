name: Deploy Invoice Ninja to Production

on:
  push:
    branches:
      - v5-stable   # Deploy ONLY when v5-stable gets new code

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Copy files to production server
        run: rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . ${{ secrets.PROD_SERVER }}:C:/production/invoice-ninja/

      - name: Restart Docker on production
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SERVER }} "cd C:/production/invoice-ninja && docker compose down && docker compose up -d"
