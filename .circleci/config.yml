version: 2.1

jobs:
  build:
    docker:
      - image: cimg/php:8.2-node
    steps:
      - checkout

      - run:
          name: Update System
          command: sudo apt-get update

      - run:
          name: Install Composer
          command: sudo apt-get install composer -y

      - run:
          name: Install PHP Dependencies
          command: composer install --no-interaction --prefer-dist --optimize-autoloader

      - run:
          name: Install Node Dependencies
          command: npm install

      - run:
          name: Build Frontend
          command: npm run production

      - run:
          name: Laravel Build Optimizations
          command: |
            php artisan optimize
            php artisan config:cache
            php artisan route:cache

      - setup_remote_docker

      - run:
          name: Build Docker Image
          command: docker build -t invoiceninja-app:latest .

      - run:
          name: Save Docker Image
          command: docker save invoiceninja-app:latest -o invoiceninja-app.tar

      - store_artifacts:
          path: invoiceninja-app.tar
          destination: docker-image

      # Optional: save compiled assets/vendor folder
      - store_artifacts:
          path: ./vendor
          destination: php-vendor

      - store_artifacts:
          path: ./public/build
          destination: frontend-build

      - run:
          name: Login to Docker Hub
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin

      - run:
          name: Tag Docker Image for Docker Hub
          command: docker tag invoiceninja-app:latest $DOCKERHUB_USERNAME/invoiceninja:latest

      - run:
          name: Push Docker Image to Docker Hub
          command: docker push $DOCKERHUB_USERNAME/invoiceninja:latest

workflows:
  build-workflow:
    jobs:
      - build
